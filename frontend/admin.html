<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - PEMILU UKMR 2026</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Unbounded:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script defer src="admin.js"></script>
  
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    body {
      margin: 0;
      min-height: 100vh; 
      overflow-x: hidden;
      /* Background konsisten dengan halaman sebelumnya */
      background: linear-gradient(rgba(183, 219, 104, 0.4), rgba(0, 0, 0, 0.9)), url('images/IMG_1308.JPEG');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    #group {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .font-poppins { font-family: 'Poppins', sans-serif; }
    .font-unbounded { font-family: 'Unbounded', sans-serif; }
  </style>
</head>

<body class="flex flex-col items-center justify-start min-h-screen px-4 py-12 relative">

  <div id="group"></div>

  <img src="images/logo bg transparent.png" alt="Logo UKMR" 
       class="fixed top-4 right-4 md:top-8 md:right-8 z-50 w-16 h-16 md:w-20 md:h-20 object-cover drop-shadow-lg">

  <div class="relative z-10 w-full max-w-5xl flex flex-col items-center gap-12 mt-12 md:mt-8">
      
      <h1 class="text-4xl md:text-5xl font-poppins font-extrabold text-[#332277] text-center drop-shadow-lg tracking-wide leading-tight">
          Dashboard Admin <br>
          <span class="text-white text-3xl md:text-4xl font-poppins mt-2 block">PEMILU UKMR 2026</span>
      </h1>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
          
          <div class="bg-[#F0EFEB] rounded-[30px] p-8 shadow-2xl flex flex-col items-center gap-6 transform transition-all duration-300 hover:shadow-[0_0_30px_rgba(216,248,120,0.3)] hover:-translate-y-1">
              <h2 class="text-xl md:text-2xl font-bold text-[#332277] text-center font-poppins leading-snug">
                  Status Partisipasi Pemilih
              </h2>
              <div class="w-full flex justify-center">
                  <div class="w-full flex justify-center h-[300px]"> <canvas id="totalVoterChart"></canvas>
                </div>
              </div>
          </div>

          <div class="bg-[#F0EFEB] rounded-[30px] p-8 shadow-2xl flex flex-col items-center gap-6 transform transition-all duration-300 hover:shadow-[0_0_30px_rgba(216,248,120,0.3)] hover:-translate-y-1">
              <h2 class="text-xl md:text-2xl font-bold text-[#332277] text-center font-poppins leading-snug">
                  Perolehan Suara Kandidat
              </h2>
              <div class="w-full flex justify-center">
                  <div class="w-full flex justify-center h-[300px]"> <canvas id="candidateChart"></canvas>
                </div>
              </div>
          </div>

      </div>

      <button id="logoutBtn" 
              class="mt-8 py-4 px-12 rounded-full bg-gradient-to-r from-red-600 to-red-500 text-white hover:from-red-500 hover:to-red-400 font-poppins font-bold text-[20px] shadow-[0_0_20px_rgba(220,38,38,0.5)] transition-all duration-300 transform hover:scale-105">
          Logout
      </button>

  </div>

  <script>
    const group = document.getElementById("group");
    function createStaticSquares() {
      group.innerHTML = "";
      const squareSize = 60;
      const totalSquares = Math.ceil(window.innerWidth / squareSize) + 1;

      // Baris Bawah
      for (let i = 0; i < totalSquares; i++) {
        const square = document.createElement("div");
        square.className = "square";
        square.style.width = squareSize + "px";
        square.style.height = squareSize + "px";
        square.style.left = i * squareSize + "px";
        square.style.top = (i % 2 === 0) ? (window.innerHeight - 120) + "px" : (window.innerHeight - 60) + "px";
        group.appendChild(square);
      }
      
      // Baris Atas
      for (let i = 0; i < totalSquares; i++) {
        const square = document.createElement("div");
        square.className = "square";
        square.style.width = squareSize + "px";
        square.style.height = squareSize + "px";
        square.style.left = i * squareSize + "px";
        square.style.top = (i % 2 === 0) ? "0px" : "60px";
        group.appendChild(square);
      }
    }
    
    createStaticSquares();
    window.addEventListener("resize", createStaticSquares);
  </script>
</body>
</html>
