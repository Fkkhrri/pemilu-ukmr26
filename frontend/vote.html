<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voting - PEMILU UKMR 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Unbounded:wght@500&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(183, 219, 104, 0.4), rgba(0, 0, 0, 0.9)), url('images/IMG_1308.JPEG');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Poppins', sans-serif;
    }

    #group {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>

<body class="flex flex-col items-center py-16 px-4 relative">
  <div id="group"></div>

  <div class="relative z-10 w-full max-w-6xl flex flex-col items-center">
    
    <div class="flex flex-col items-center gap-4 w-full">
    <img src="images/logo bg transparent.png" alt="Logo UKMR" 
         class="w-[140px] h-[140px] md:w-[180px] md:h-[180px] object-cover animate-spin-slow">
    
    <img src="images/Pemilu U KMR 2 026.png" alt="Judul" 
         class="w-[85%] max-w-[320px] md:max-w-[400px] object-contain drop-shadow-lg mb-4">
    </div>
      <p class="text-[#F0EFEB] text-lg font-poppins opacity-90">Pilihlah Nakhoda Unit Kebudayaan Melayu Riau dengan bijak</p>
      
      <div id="countdown" class="mt-6 text-2xl md:text-3xl font-bold text-[#332277] bg-[#D8F878] px-8 py-4 rounded-full inline-block shadow-xl"></div>
    </div>

    <div id="kandidatContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 w-full">
      </div>

    <footer class="mt-20 text-[#F0EFEB]/60 text-sm font-poppins">
      © 2026 Copyright: Divisi IT PEMILU UKMR ITB 2026
    </footer>
  </div>

  <script>
    const countdownElement = document.getElementById('countdown');

// Samakan dengan waktu di vote.js
// Samakan dengan waktu di vote.js
const MULAI = new Date('2026-08-18T00:00:00').getTime();
const SELESAI = new Date('2026-08-25T23:59:59').getTime();

function updateCountdown() {
  const now = new Date().getTime();

  // Kondisi 1: Belum mulai
  if (now < MULAI) {
    const distance = MULAI - now;
    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((distance % (1000 * 60)) / 1000);
    
    countdownElement.textContent = `${d.toString().padStart(2,'0')}:${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  } 
  // Kondisi 2: Sedang berlangsung
  else if (now >= MULAI && now <= SELESAI) {
    countdownElement.textContent = 'Waktu Pemilihan Berlangsung';
  } 
  // Kondisi 3: Sudah lewat jam selesai
  else {
    countdownElement.textContent = 'Waktu Pemilihan Telah Berakhir';
  }
}

updateCountdown();
setInterval(updateCountdown, 1000);

    const group = document.getElementById("group");
    function createStaticSquares() {
      group.innerHTML = "";
      const sSize = 60;
      const total = Math.ceil(window.innerWidth / sSize) + 1;
      for (let i = 0; i < total; i++) {
        const sq1 = document.createElement("div"); sq1.className = "square";
        sq1.style.width = sSize + "px"; sq1.style.height = sSize + "px";
        sq1.style.left = (i * sSize) + "px"; sq1.style.top = (i % 2 === 0 ? window.innerHeight - 120 : window.innerHeight - 60) + "px";
        group.appendChild(sq1);
        const sq2 = document.createElement("div"); sq2.className = "square";
        sq2.style.width = sSize + "px"; sq2.style.height = sSize + "px";
        sq2.style.left = (i * sSize) + "px"; sq2.style.top = (i % 2 === 0 ? 0 : 60) + "px";
        group.appendChild(sq2);
      }
    }
    createStaticSquares();
    window.addEventListener("resize", createStaticSquares);
  </script>
  <script defer src="vote.js"></script>
</body>
</html>
