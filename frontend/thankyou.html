<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Terima Kasih — PEMILU UKMR 2026</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Unbounded:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: 'Poppins', sans-serif;
      /* Background konsisten */
      background: linear-gradient(rgba(183, 219, 104, 0.4), rgba(0, 0, 0, 0.9)), url('images/IMG_1308.JPEG');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Animasi Centang */
    .checkmark {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #D8F878, #9448B0);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(216, 248, 120, 0.4);
      margin-bottom: 1.5rem;
    }

    .checkmark svg {
      width: 70px;
      height: 70px;
      stroke: #332277;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 0.6s ease forwards 0.25s;
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
</head>

<body>
  <!-- Efek Latar Kotak Statik -->
  <div id="group" class="fixed inset-0 pointer-events-none z-0"></div>

  <main class="relative z-10 bg-[#F0EFEB] rounded-[30px] shadow-2xl p-10 max-w-lg w-full text-center transform transition-all duration-300">
    <div class="flex flex-col items-center">
      <div class="checkmark">
        <svg viewBox="0 0 52 52">
          <path d="M14 27 L22 34 L38 16"></path>
        </svg>
      </div>
      
      <h1 class="text-3xl font-extrabold text-[#332277] mb-4 font-poppins">Terima Kasih!</h1>
      <p class="text-[#001C3D] mb-8 font-poppins">
        Suaramu telah berhasil tercatat dalam sistem <br>
        <span class="font-bold">PEMILU UKMR 2026.</span><br>
        Terima kasih telah berpartisipasi!
      </p>

      <button id="backBtn" class="w-full py-4 rounded-xl bg-gradient-to-r from-[#332277] to-[#9448B0] text-white font-bold text-[18px] hover:opacity-90 transition-all duration-300 shadow-lg transform hover:-translate-y-1">
        Kembali ke Login
      </button>
    </div>
  
  </main>

  <script>
    // Efek Kotak Latar
    const group = document.getElementById("group");
    function createSquares() {
      const sSize = 60;
      const total = Math.ceil(window.innerWidth / sSize) + 1;
      for (let i = 0; i < total; i++) {
        const s = document.createElement("div");
        s.className = "square";
        s.style.width = sSize + "px"; s.style.height = sSize + "px";
        s.style.left = (i * sSize) + "px";
        s.style.top = (i % 2 === 0 ? "20px" : "80px");
        group.appendChild(s);
      }
    }
    createSquares();

    // Logout
    document.getElementById('backBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });
  </script>
</body>

</html>
